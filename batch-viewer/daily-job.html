<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>日次取引の照合・計上・レポート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* バッチ設計ビューワー共通スタイル。左に「読む順」、中央に図や一覧、右（狭い画面では下）に詳細と根拠コード */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --sunken: #e9efed;
  --ink: #182d31;
  --muted: #55686d;
  --line: #d3ddd9;
  --accent: #106955;
  --accent-soft: #dcf1e9;
  --warn: #8a5300;
  --warn-soft: #fbedd3;
  --err: #a8322a;
  --err-soft: #f9e2df;
  --hl: #fff2a8;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1c; --surface: #142427; --sunken: #0b1517; --ink: #e2ece9; --muted: #9db1b1;
    --line: #29403f; --accent: #5cd0ad; --accent-soft: #123a31; --warn: #f0b45a; --warn-soft: #3a2b10;
    --err: #ff8f84; --err-soft: #3c1b18; --hl: #4a4410; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1c; --surface: #142427; --sunken: #0b1517; --ink: #e2ece9; --muted: #9db1b1;
  --line: #29403f; --accent: #5cd0ad; --accent-soft: #123a31; --warn: #f0b45a; --warn-soft: #3a2b10;
  --err: #ff8f84; --err-soft: #3c1b18; --hl: #4a4410; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1480px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
header.top h1 { font-size: 20px; margin: 0; text-wrap: balance; }
header.top .pg { font-family: var(--mono); font-size: 13px; color: var(--muted); }
header.top .demo { margin-left: auto; font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 2px 10px; border-radius: 999px; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
nav.rail .cap { font-size: 11px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
nav.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s; }
nav.rail button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 2px 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
nav.rail button .n { font-family: var(--mono); font-size: 12px; color: var(--muted); grid-row: span 2; padding-top: 1px; }
nav.rail button .t { font-weight: 500; }
nav.rail button .d { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
nav.rail button:hover { background: var(--sunken); }
nav.rail button[aria-current="true"] { background: var(--accent-soft); }
nav.rail button[aria-current="true"] .n, nav.rail button[aria-current="true"] .t { color: var(--accent); }
nav.rail button:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.railnote { margin-top: 14px; font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 10px; }
main { min-width: 0; }
.viewhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
.viewhead h2 { margin: 0; font-size: 18px; }
.doctag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 72ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.none { background: var(--sunken); color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }

/* 概要 */
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.check { padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.check h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.check p { margin: 0; font-size: 13px; }
.check .ev { font-size: 12px; color: var(--muted); }
.summary { padding: 16px 18px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 24px; }
.summary div b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.summary div span { font-size: 15px; font-weight: 500; }

/* 図 */
.scroll { overflow-x: auto; }
svg text { fill: var(--ink); font-family: var(--sans); }
svg .sub { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
svg .lbl { fill: var(--muted); font-size: 11px; }
svg .node { cursor: pointer; }
svg .node .shape { fill: var(--surface); stroke: var(--ink); stroke-width: 1.3; }
svg .node.warn .shape { fill: var(--warn-soft); stroke: var(--warn); }
svg .node.err .shape { fill: var(--err-soft); stroke: var(--err); }
svg .node.routine .shape { fill: var(--sunken); }
svg .node:hover .shape { stroke-width: 2.2; }
svg .node.sel .shape { stroke: var(--accent); stroke-width: 3; }
svg .node.cur .shape { fill: var(--hl); stroke: var(--accent); stroke-width: 3; }
svg .node.dim { opacity: .28; }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
svg .edge.err { stroke: var(--err); }
svg .edge.warn { stroke: var(--warn); }
svg .edge.dash { stroke-dasharray: 5 4; }
svg .edge.walked { stroke: var(--accent); stroke-width: 3; }
svg .edge.dim { opacity: .2; }
svg .ah { fill: var(--muted); }
svg .note rect { fill: var(--warn-soft); stroke: var(--warn); stroke-dasharray: 4 3; }
svg .note text { font-size: 11.5px; }
svg .file rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
svg .file.unused rect { stroke: var(--muted); stroke-dasharray: 4 3; fill: var(--sunken); }
svg .file.unknown rect { stroke: var(--muted); stroke-dasharray: 2 3; fill: none; }
svg .prog rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }

.flowgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 16px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); }
.legend i { display: inline-block; width: 22px; height: 12px; vertical-align: -1px; margin-right: 4px; border: 1.3px solid var(--ink); background: var(--surface); }
.legend i.dec { transform: rotate(45deg) scale(.7); width: 12px; }
.legend i.term { border-radius: 999px; }
.legend i.pre { box-shadow: inset 4px 0 0 -2.6px var(--ink), inset -4px 0 0 -2.6px var(--ink); }
.legend i.warn { background: var(--warn-soft); border-color: var(--warn); }
.legend i.err { background: var(--err-soft); border-color: var(--err); }
aside.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 32px); overflow: auto; }
.dhead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.dhead h3 { margin: 0; font-size: 16px; }
.dhead .orig { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.dbody { padding: 12px 16px 16px; display: grid; gap: 12px; }
.dbody p { margin: 0; }
.ranges { display: flex; flex-wrap: wrap; gap: 6px; }
.ranges button { all: unset; cursor: pointer; font-family: var(--mono); font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 4px; }
.ranges button:hover { border-color: var(--accent); color: var(--accent); }
pre.src { margin: 0; background: var(--sunken); border-radius: 6px; padding: 8px 0; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
pre.src .ln { display: block; padding: 0 10px 0 0; white-space: pre; }
pre.src .ln span.no { display: inline-block; width: 40px; text-align: right; color: var(--muted); padding-right: 10px; user-select: none; }
pre.src .ln.cm { color: var(--muted); }
.src-gap { display: block; color: var(--muted); padding-left: 50px; font-size: 11px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; color: var(--muted); font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.diff td { background: var(--warn-soft); }
.callout { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 13px; }

/* トレース */
.trace { display: grid; gap: 10px; }
.tctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tctl select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { opacity: .4; cursor: default; }
.stepinfo { font-size: 13px; }
.ws { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; background: var(--sunken); padding: 8px 12px; border-radius: 6px; }
.ws dt { color: var(--muted); }
.ws dd { margin: 0; font-family: var(--mono); }
.ws dd.chg { background: var(--hl); }
.log { background: var(--sunken); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.log .new { background: var(--hl); }
.log .dup { color: var(--warn); }

/* 入出力 */
.chain { padding: 14px 16px; margin-top: 16px; }
.chain h3 { margin: 0 0 8px; font-size: 14px; }
.io-unused td { color: var(--muted); }

/* 網羅 */
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(5px, 1fr)); gap: 1px; padding: 12px; }
.strip span { height: 14px; border-radius: 1px; background: var(--sunken); cursor: pointer; }
.strip span.c-flow { background: var(--accent); }
.strip span.c-gap { background: var(--err); }
.strip span.c-def { background: var(--line); }
.strip span.c-cm { background: var(--sunken); }
.cov { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
.cov .panel { padding: 12px 14px; }
.cov b { font-size: 22px; font-variant-numeric: tabular-nums; }
.cov small { display: block; color: var(--muted); font-size: 12px; }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.paras { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; }
.open-items { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.section-gap { height: 16px; }

.chip { all: unset; box-sizing: border-box; cursor: pointer; font-size: 12px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); line-height: 1.6; white-space: nowrap; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rel { display: grid; gap: 6px; padding: 10px 12px; background: var(--sunken); border-radius: 8px; }
.rh { font-size: 12px; color: var(--muted); font-weight: 500; display: block; margin-bottom: 4px; }
.relrow { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: start; }
.relrow .rl { font-size: 12px; color: var(--muted); padding-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chips .none { font-size: 12px; color: var(--muted); }
details.more { width: 100%; font-size: 12px; }
details.more summary { cursor: pointer; color: var(--accent); }
details.more[open] { display: flex; flex-wrap: wrap; gap: 4px; }
tbody tr[data-sel] { cursor: pointer; }
tbody tr[data-sel]:hover td { background: var(--sunken); }
tr.selrow td, tr.selrow:hover td { background: var(--accent-soft); }
.pill.rec { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.docmap { padding: 14px 16px; margin-bottom: 16px; }
.dm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.dm button { all: unset; box-sizing: border-box; cursor: pointer; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; display: grid; background: var(--surface); }
.dm button b { font-size: 13px; }
.dm button span { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.dm button:hover { border-color: var(--accent); }
.dm button:focus-visible { outline: 2px solid var(--accent); }
.dm .ar { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.3; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; margin: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; }
.lay rect { stroke: var(--surface); stroke-width: 1; cursor: pointer; }
.lay .u-ok { fill: var(--accent); }
.lay .u-rec { fill: var(--accent-soft); }
.lay .u-none { fill: var(--line); }
.lay .u-fill { fill: var(--sunken); }
.lay rect:hover { stroke: var(--ink); }
.filters input { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); width: 200px; max-width: 100%; }
.filters .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.dfd g[data-k] { cursor: pointer; }
.dfd .shape { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
.dfd .store .bg { fill: var(--surface); }
.dfd .store .sl { stroke: var(--ink); stroke-width: 1.4; }
.dfd .store.unused .sl { stroke: var(--muted); stroke-dasharray: 4 3; }
.dfd .store.unused text { fill: var(--muted); }
.dfd .fl { stroke: var(--muted); stroke-width: 1.4; }
.dfd .fl.est { stroke-dasharray: 5 4; }
.dfd .hit { stroke: transparent; stroke-width: 16; }
.dfd .flab { font-size: 11.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.dfd .flow.on .fl { stroke: var(--accent); stroke-width: 2.6; }
.dfd .flow.on .flab, .dfd .flow.sel .flab { fill: var(--accent); font-weight: 700; }
.dfd .rel .shape, .dfd .rel .sl { stroke: var(--accent); }
.dfd .sel .shape, .dfd .sel .sl { stroke: var(--accent); stroke-width: 3; }
.dfd .sel .shape { fill: var(--accent-soft); }
.dfd g[data-k]:hover .shape, .dfd g[data-k]:hover .sl { stroke-width: 2.4; }

@media (max-width: 1100px) {
  .flowgrid { grid-template-columns: minmax(0, 1fr); }
  aside.detail { position: static; max-height: none; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.rail { position: static; }
  nav.rail ol { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 4px; }
  nav.rail button { grid-template-columns: auto auto; }
  nav.rail button .d { display: none; }
  nav.rail button .n { grid-row: auto; }
  .railnote { display: none; }
  header.top .demo { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  svg .node .shape, svg .edge { transition: stroke-width .15s, opacity .2s, fill .2s; }
}

header.top a.uplink { font-size: 12.5px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
header.top a.uplink:hover { border-color: var(--accent); }
table.matrix { width: auto; border-collapse: collapse; font-size: 12.5px; }
table.matrix th, table.matrix td { border: 1px solid var(--line); padding: 4px 8px; text-align: center; }
table.matrix th.rowh, table.matrix td.rowh { text-align: left; white-space: nowrap; }
table.matrix thead th { vertical-align: bottom; min-width: 64px; }
table.matrix td.cell { font-family: var(--mono); font-weight: 500; cursor: pointer; min-width: 52px; }
table.matrix td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
table.matrix td.cell.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
table.matrix tr.selrow td.rowh { background: var(--accent-soft); }
.l-C { background: var(--accent-soft); color: var(--accent); }
.l-U { background: var(--warn-soft); color: var(--warn); }
.l-D { background: var(--err-soft); color: var(--err); }
.l-R { color: var(--ink); }
.l-O { color: var(--muted); }
svg .jobframe { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 6 4; }
svg .stepbox { cursor: pointer; }
svg .stepbox .shape { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
svg .stepbox.assumed .shape { stroke-dasharray: 5 4; }
svg .stepbox.sel .shape { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
svg .stepbox:hover .shape { stroke-width: 2.4; }
.checks-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.checks-list li { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 13px; }
.checks-list button { all: unset; cursor: pointer; }
.checks-list button:hover { color: var(--accent); }
.flowgrid.stack { grid-template-columns: minmax(0, 1fr); }
.flowgrid.stack aside.detail { position: static; max-height: none; }
.lay { max-width: 640px; }

</style>

<div class="wrap">
  <header class="top">
    <h1 id="h-title"></h1>
    <span class="pg" id="h-pg"></span>
  </header>
  <div class="layout">
    <nav class="rail" aria-label="読む順">
      <p class="cap">読む順</p>
      <ol id="rail"></ol>
      <p class="railnote">ジョブ全体を、ステップ（S）・データストア（D）・データフロー（F）・データ項目（DI）の共通IDでつないでいます。プログラムごとの詳細は、ステップの「プログラムビューワー」から開きます。</p>
    </nav>
    <main id="main"></main>
  </div>

   DISPLAY DALYTRAN-RECORD                                    ","                     MOVE 0 TO WS-VALIDATION-FAIL-REASON                        ","                     MOVE SPACES TO WS-VALIDATION-FAIL-REASON-DESC              ","                     PERFORM 1500-VALIDATE-TRAN                                 ","                     IF WS-VALIDATION-FAIL-REASON = 0                           ","                       PERFORM 2000-POST-TRANSACTION                            ","                     ELSE                                                       ","                       ADD 1 TO WS-REJECT-COUNT                                 ","                       PERFORM 2500-WRITE-REJECT-REC                            ","                     END-IF                                                     ","                   END-IF                                                       ","               END-IF                                                           ","           END-PERFORM.                                                         ","                                                                                ","           PERFORM 9000-DALYTRAN-CLOSE.                                         ","           PERFORM 9100-TRANFILE-CLOSE.                                         ","           PERFORM 9200-XREFFILE-CLOSE.                                         ","           PERFORM 9300-DALYREJS-CLOSE.                                         ","           PERFORM 9400-ACCTFILE-CLOSE.                                         ","           PERFORM 9500-TCATBALF-CLOSE.                                         ","           DISPLAY 'TRANSACTIONS PROCESSED :' WS-TRANSACTION-COUNT              ","           DISPLAY 'TRANSACTIONS REJECTED  :' WS-REJECT-COUNT                   ","           IF WS-REJECT-COUNT > 0                                               ","              MOVE 4 TO RETURN-CODE                                             ","           END-IF "              NOT INVALID KEY                                                   ","      *         DISPLAY 'ACCT-CREDIT-LIMIT:' ACCT-CREDIT-LIMIT                  ","      *         DISPLAY 'TRAN-AMT         :' DALYTRAN-AMT                       ","                COMPUTE WS-TEMP-BAL = ACCT-CURR-CYC-CREDIT                      ","                                    - ACCT-CURR-CYC-DEBIT                       ","                                    + DALYTRAN-AMT                              ","                                                                                ","                IF ACCT-CREDIT-LIMIT >= WS-TEMP-BAL                             ","                  CONTINUE                                                      ","                ELSE                                                            ","                  MOVE 102 TO WS-VALIDATION-FAIL-REASON                         ","                  MOVE 'OVERLIMIT TRANSACTION'                                  ","                    TO WS-VALIDATION-FAIL-REASON-DESC                           ","                END-IF                                                          ","                IF ACCT-EXPIRAION-DATE >= DALYTRAN-ORIG-TS (1:10)               ","                  CONTINUE                                                      ","                ELSE                                                            ","                  MOVE 103 TO WS-VALIDATION-FAIL-REASON                         ","                  MOVE 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION'             ","                    TO WS-VALIDATION-FAIL-REASON-DESC                           ","                END-IF                                                          ","           END-READ                                                             ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       2000-POST-TRANSACTION.                                                   ","           MOVE  DALYTRAN-ID            TO    TRAN-ID                           ","           MOVE  DALYTRAN-TYPE-CD       TO    TRAN-TYPE-CD                      ","           MOVE  DALYTRAN-CAT-CD        TO    TRAN-CAT-CD                       ","           MOVE  DALYTRAN-SOURCE        TO    TRAN-SOURCE                       ","           MOVE  DALYTRAN-DESC          TO    TRAN-DESC                         ","           MOVE  DALYTRAN-AMT           TO    TRAN-AMT                          ","           MOVE  DALYTRAN-MERCHANT-ID   TO    TRAN-MERCHANT-ID                  ","           MOVE  DALYTRAN-MERCHANT-NAME TO    TRAN-MERCHANT-NAME                ","           MOVE  DALYTRAN-MERCHANT-CITY TO    TRAN-MERCHANT-CITY                ","           MOVE  DALYTRAN-MERCHANT-ZIP  TO    TRAN-MERCHANT-ZIP                 ","           MOVE  DALYTRAN-CARD-NUM      TO    TRAN-CARD-NUM                     ","           MOVE  DALYTRAN-ORIG-TS       TO    TRAN-ORIG-TS                      ","           PERFORM Z-GET-DB2-FORMAT-TIMESTAMP                                   ","           MOVE  DB2-FORMAT-TS          TO    TRAN-PROC-TS                      ","                                                                                ","           PERFORM 2700-UPDATE-TCATBAL                                          ","           PERFORM 2800-UPDATE-ACCOUNT-REC                                      ","           PERFORM 2900-WRITE-TRANSACTION-FILE                                  ","                                                                                ","           EXIT.                                                                ","                                                                                ","       2500-WRITE-REJECT-REC.                                                   ","           MOVE DALYTRAN-RECORD TO REJECT-TRAN-DATA                             ","           MOVE WS-VALIDATION-TRAILER TO VALIDATION-TRAILER                     ","      *     DISPLAY '***' REJECT-RECORD                                         ","           MOVE 8 TO APPL-RESULT                                                ","           WRITE FD-REJS-RECORD FROM REJECT-RECORD                              ","           IF DALYREJS-STATUS = '00'                                            ","               MOVE 0 TO  APPL-RESULT                                           ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR WRITING TO REJECTS FILE'                          ","               MOVE DALYREJS-STATUS  TO IO-STATUS                               ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       2700-UPDATE-TCATBAL.                                                     ","      * Update the balances in transaction balance file.                        ","           MOVE XREF-ACCT-ID TO FD-TRANCAT-ACCT-ID                              ","           MOVE DALYTRAN-TYPE-CD TO FD-TRANCAT-TYPE-CD                          ","           MOVE DALYTRAN-CAT-CD TO FD-TRANCAT-CD                                ","                                                                                ","           MOVE 'N' TO WS-CREATE-TRANCAT-REC                                    ","           READ TCATBAL-FILE INTO TRAN-CAT-BAL-RECORD                           ","              INVALID KEY                                                       ","                DISPLAY 'TCATBAL record not found for key : '                   ","                   FD-TRAN-CAT-KEY '.. Creating.'                               ","                MOVE 'Y' TO WS-CREATE-TRANCAT-REC                               ","           END-READ.                                                            ","                                                                                ","           IF  TCATBALF-STATUS = '00'  OR '23'                                  ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR READING TRANSACTION BALANCE FILE'                 ","               MOVE TCATBALF-STATUS TO IO-STATUS                                ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF.                                                              ","                                                                                ","           IF WS-CREATE-TRANCAT-REC = 'Y'                                       ","              PERFORM 2700-A-CREATE-TCATBAL-REC                                 ","           ELSE                                                                 ","              PERFORM 2700-B-UPDATE-TCATBAL-REC                                 ","           END-IF                                                               ","                                                                                ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       2700-A-CREATE-TCATBAL-REC.                                               ","           INITIALIZE TRAN-CAT-BAL-RECORD                                       ","           MOVE XREF-ACCT-ID TO TRANCAT-ACCT-ID                                 ","           MOVE DALYTRAN-TYPE-CD TO TRANCAT-TYPE-CD                             ","           MOVE DALYTRAN-CAT-CD TO TRANCAT-CD                                   ","           ADD DALYTRAN-AMT TO TRAN-CAT-BAL                                     ","                                                                                ","           WRITE FD-TRAN-CAT-BAL-RECORD FROM TRAN-CAT-BAL-RECORD                ","                                                                                ","           IF  TCATBALF-STATUS = '00'                                           ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR WRITING TRANSACTION BALANCE FILE'                 ","               MOVE TCATBALF-STATUS TO IO-STATUS                                ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF.                                                              ","      *---------------------------------------------------------------*         ","       2700-B-UPDATE-TCATBAL-REC.                                               ","           ADD DALYTRAN-AMT TO TRAN-CAT-BAL                                     ","           REWRITE FD-TRAN-CAT-BAL-RECORD FROM TRAN-CAT-BAL-RECORD              ","                                                                                ","           IF  TCATBALF-STATUS = '00'                                           ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR REWRITING TRANSACTION BALANCE FILE'               ","               MOVE TCATBALF-STATUS TO IO-STATUS                                ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF.                                                              ","                                                                                ","      *---------------------------------------------------------------*         ","       2800-UPDATE-ACCOUNT-REC.                                                 ","      * Update the balances in account record to reflect posted trans.          ","           ADD DALYTRAN-AMT  TO ACCT-CURR-BAL                                   ","           IF DALYTRAN-AMT >= 0                                                 ","              ADD DALYTRAN-AMT TO ACCT-CURR-CYC-CREDIT                          ","           ELSE                                                                 ","              ADD DALYTRAN-AMT TO ACCT-CURR-CYC-DEBIT                           ","           END-IF                                                               ","                                                                                ","           REWRITE FD-ACCTFILE-REC FROM  ACCOUNT-RECORD                         ","              INVALID KEY                                                       ","                MOVE 109 TO WS-VALIDATION-FAIL-REASON                           ","                MOVE 'ACCOUNT RECORD NOT FOUND'                                 ","                  TO WS-VALIDATION-FAIL-REASON-DESC                             ","           END-REWRITE.                                                         ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       2900-WRITE-TRANSACTION-FILE.                                             ","           MOVE 8 TO  APPL-RESULT.                                              ","           WRITE FD-TRANFILE-REC FROM TRAN-RECORD                               ","                                                                                ","           IF  TRANFILE-STATUS = '00'                                           ","               MOVE 0 TO  APPL-RESULT                                           ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR WRITING TO TRANSACTION FILE'                      ","               MOVE TRANFILE-STATUS  TO IO-STATUS                               ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","                                                                                ","      *---------------------------------------------------------------*         ","       9000-DALYTRAN-CLOSE.                                                     ","           MOVE 8 TO  APPL-RESULT.                                              ","           CLOSE DALYTRAN-FILE                                                  ","           IF  DALYTRAN-STATUS = '00'                                           ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR CLOSING DALYTRAN FILE'                            ","               MOVE DALYTRAN-STATUS TO IO-STATUS                                ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       9100-TRANFILE-CLOSE.                                                     ","           MOVE 8 TO  APPL-RESULT.                                              ","           CLOSE TRANSACT-FILE                                                  ","           IF  TRANFILE-STATUS = '00'                                           ","               MOVE 0 TO  APPL-RESULT                                           ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR CLOSING TRANSACTION FILE'                         ","               MOVE TRANFILE-STATUS  TO IO-STATUS                               ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","                                                                                ","      *---------------------------------------------------------------*         ","       9200-XREFFILE-CLOSE.                                                     ","           MOVE 8 TO APPL-RESULT.                                               ","           CLOSE XREF-FILE                                                      ","           IF  XREFFILE-STATUS = '00'                                           ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR CLOSING CROSS REF FILE'                           ","               MOVE XREFFILE-STATUS TO IO-STATUS                                ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       9300-DALYREJS-CLOSE.                                                     ","           MOVE 8 TO APPL-RESULT.                                               ","           CLOSE DALYREJS-FILE                                                  ","           IF  DALYREJS-STATUS = '00'                                           ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR CLOSING DAILY REJECTS FILE'                       ","               MOVE XREFFILE-STATUS TO IO-STATUS                                ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","      *---------------------------------------------------------------*         ","       9400-ACCTFILE-CLOSE.                                                     ","           MOVE 8 TO APPL-RESULT.                                               ","           CLOSE ACCOUNT-FILE                                                   ","           IF  ACCTFILE-STATUS  = '00'                                          ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR CLOSING ACCOUNT FILE'                             ","               MOVE ACCTFILE-STATUS  TO IO-STATUS                               ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","                                                                                ","      *---------------------------------------------------------------*         ","       9500-TCATBALF-CLOSE.                                                     ","           MOVE 8 TO APPL-RESULT.                                               ","           CLOSE TCATBAL-FILE                                                   ","           IF  TCATBALF-STATUS  = '00'                                          ","               MOVE 0 TO APPL-RESULT                                            ","           ELSE                                                                 ","               MOVE 12 TO APPL-RESULT                                           ","           END-IF                                                               ","           IF  APPL-AOK                                                         ","               CONTINUE                                                         ","           ELSE                                                                 ","               DISPLAY 'ERROR CLOSING TRANSACTION BALANCE FILE'                 ","               MOVE TCATBALF-STATUS  TO IO-STATUS                               ","               PERFORM 9910-DISPLAY-IO-STATUS                                   ","               PERFORM 9999-ABEND-PROGRAM                                       ","           END-IF                                                               ","           EXIT.                                                                ","                                                                                ","       Z-GET-DB2-FORMAT-TIMESTAMP.                                              ","           MOVE FUNCTION CURRENT-DATE TO COBOL-TS                               ","           MOVE COB-YYYY TO DB2-YYYY                                            ","           MOVE COB-MM   TO DB2-MM                                              ","           MOVE COB-DD   TO DB2-DD                                              ","           MOVE COB-HH   TO DB2-HH                                              ","           MOVE COB-MIN  TO DB2-MIN                                             ","           MOVE COB-SS   TO DB2-SS                                              ","           MOVE COB-MIL  TO DB2-MIL                                             ","           MOVE '0000'   TO DB2-REST                                            ","           MOVE '-' TO DB2-STREEP-1 DB2-STREEP-2 DB2-STREEP-3                   ","           MOVE '.' TO DB2-DOT-1 DB2-DOT-2 DB2-DOT-3                            ","      *    DISPLAY 'DB2-TIMESTAMP = ' DB2-FORMAT-TS                             ","           EXIT.                                                                ","                                                                                ","       9999-ABEND-PROGRAM.                                                      ","           DISPLAY 'ABENDING PROGRAM'                                           ","           MOVE 0 TO TIMING                                                     ","           MOVE 999 TO ABCODE                                                   ","           CALL 'CEE3ABD' USING ABCODE, TIMING.                                 ","                                                                                ","      ************** TEPARM-STATUS.                              ","      *                                                                         ","       DATA DIVISION.                                                           ","       FILE SECTION.                                                            ","       FD  TRANSACT-FILE.                                                       ","       01 FD-TRANFILE-REC.                                                      ","          05 FD-TRANS-DATA      PIC X(304).                                     ","          05 FD-TRAN-PROC-TS    PIC X(26).                                      ","          05 FD-FILLER          PIC X(20).                                      ","                                                                                ","       FD  XREF-FILE.                                                           ","       01  FD-CARDXREF-REC.                                                     ","           05 FD-XREF-CARD-NUM                  PIC X(16).                      ","           05 FD-XREF-DATA                      PIC X(34).                      ","                                                                                ","       FD  TRANTYPE-FILE.                                                       ","       01 FD-TRANTYPE-REC.                                                      ","          05 FD-TRAN-TYPE       PIC X(02).                                      ","          05 FD-TRAN-DATA       PIC X(58).                                      ","                                                                                ","       FD  TRANCATG-FILE.                                                       ","       01 FD-TRAN-CAT-RECORD.                                                   ","           05  FD-TRAN-CAT-KEY.                                                 ","              10  FD-TRAN-TYPE-CD                         PIC X(02).            ","              10  FD-TRAN-CAT-CD                          PIC 9(04).            ","           05  FD-TRAN-CAT-DATA                           PIC X(54).            ","                                                                                ","       FD  REPORT-FILE.                                                         ","       01 FD-REPTFILE-REC       PIC X(133).                                     ","                                                                                ","       FD  DATE-PARMS-FILE.                                                     ","       01 FD-DATEPARM-REC       PIC X(80).                                      ","                                                                                ","       WORKING-STORAGE SECTION.                                                 ","                                                                                ","      *****************************************************************         ","       COPY CVTRA05Y.                                                           ","       01 TRANFILE-STATUS.                                                      ","          05 TRANFILE-STAT1     PIC X.                                          ","          05 TRANFILE-STAT2     PIC X.                                          ","                                                                                ","       COPY CVACT03Y.                                                           ","       01  CARDXREF-STATUS.                                                     ","           05  CARDXREF-STAT1      PIC X.                                       ","           05  CARDXREF-STAT2      PIC X.                                       ","                                                                                ","       COPY CVTRA03Y.                                                           ","       01  TRANTYPE-STATUS.                                                     ","           05  TRANTYPE-STAT1      PIC X.                                       ","           05  TRANTYPE-STAT2      PIC X.                                       ","                                                                                ","       COPY CVTRA04Y.                                                           ","       01  TRANCATG-STATUS.                                                     ","           05  TRANCATG-STAT1      PIC X.                                       ","           05  TRANCATG-STAT2      PIC X.                                       ","                                                                                ","       COPY CVTRA07Y.                                                           ","       01 TRANREPT-STATUS.                                                      ","           05 REPTFILE-STAT1     PIC X.                                         ","           05 REPTFILE-STAT2     PIC X.                                         ","                                                                                ","       01 DATEPARM-STATUS.                                                      ","           05 DATEPARM-STAT1     PIC X.                                         ","           05 DATEPARM-STAT2     PIC X.                                         ","                                                                                ","       01 WS-DATEPARM-RECORD.                                                   ","           05 WS-START-DATE      PIC X(10).                                     ","           05 FILLER             PIC X(01).                                     ","           05 WS-END-DATE        PIC X(10).                                     ","                                                                                ","       01 WS-REPORT-VARS.                                                       ","           05 WS-FIRST-TIME      PIC X      VALUE 'Y'.                          ","           05 WS-LINE-COUNTER    PIC 9(09) COMP-3                               ","                                            VALUE 0.                            ","           05 WS-PAGE-SIZE       PIC 9(03) COMP-3                               ","                                            VALUE 20.                           ","           05 WS-BLANK-LINE      PIC X(133) VALUE SPACES.                       ","           05 WS-PAGE-TOTAL      PIC S9(09)V99 VALUE 0.                         ","           05 WS-ACCOUNT-TOTAL   PIC S9(09)V99 VALUE 0.                         ","           05 WS-GRAND-TOTAL     PIC S9(09)V99 VALUE 0.                         ","           05 WS-CURR-CARD-NUM   PIC X(16) VALUE SPACES.                        ","                                                                                ","       01 IO-STATUS.                                                            ","          05 IO-STAT1           PIC X.                                          ","          05 IO-STAT2           PIC X.                                          ","       01 TWO-BYTES-BINARY      PIC 9(4) BINARY.                                ","       01 TWO-BYTES-ALPHA REDEFINES TWO-BYTES-BINARY.                           ","          05 TWO-BYTES-LEFT     PIC X.                                          ","          05 TWO-BYTES-RIGHT    PIC X.                                          ","       01 IO-STATUS-04.                                                         ","          05 IO-STATUS-0401     PIC 9      VALUE 0.                             ","          05 IO-STATUS-0403     PIC 999    VALUE 0.                             ","                                                                                ","       01 APPL-RESULT           PIC S9(9) COMP.                                 ","          88 APPL-AOK                      VALUE 0.                             ","          88 APPL-EOF                      VALUE 16.                            ","                                                                                ","       01 END-OF-FILE           PIC X(01)  VALUE 'N'.                           ","       01 ABCODE                PIC S9(9) BINARY.                               ","       01 TIMING                PIC S9(9) BINARY.                               ","                                                                                ","      *****************************************************************         ","       PROCEDURE DIVISION.                                                      ","           DISPLAY 'START OF EXECUTION OF PROGRAM CBTRN03C'.                    ","           PERFORM 0000-TRANFILE-OPEN.                                          ","           PERFORM 0100-REPTFILE-OPEN.                                          ","           PERFORM 0200-CARDXREF-OPEN.                                          ","           PERFORM 0300-TRANTYPE-OPEN.                                          ","           PERFORM 0400-TRANCATG-OPEN.                                          ","           PERFORM 0500-DATEPARM-OPEN.                                          ","                                                                                ","           PERFORM 0550-DATEPARM-READ.                                          ","                                                                                ","           PERFORM UNTIL END-OF-FILE = 'Y'                                      ","             IF END-OF-FILE = 'N'                                               ","                PERFORM 1000-TRANFILE-GET-NEXT                                  ","                IF TRAN-PROC-TS (1:10) >= WS-START-DATE                         ","                   AND TRAN-PROC-TS (1:10) <= WS-END-DATE                       ","                   CONTINUE                                                     ","                ELSE                                                            ","                   NEXT SENTENCE                                                ","                END-IF                                                          ","                IF END-OF-FILE = 'N'                                            ","                   DISPLAY TRAN-RECORD                                          ","                   IF WS-CURR-CARD-NUM NOT= TRAN-CARD-NUM                       ","                     IF WS-FIRST-TIME = 'N'                                     ","                       PERFORM 1120-WRITE-ACCOUNT-TOTALS                        ","                     END-IF                                                     ","                     MOVE TRAN-CARD-NUM TO WS-CURR-CARD-NUM                     ","                     MOVE TRAN-CARD-NUM TO FD-XREF-CARD-NUM                     ","                     PERFORM 1500-A-LOOKUP-XREF                                 ","                   END-IF                                                       ","                   MOVE TRAN-TYPE-CD OF TRAN-RECORD TO FD-TRAN-TYPE             ","                   PERFORM 1500-B-LOOKUP-TRANTYPE                               ","                   MOVE TRAN-TYPE-CD OF TRAN-RECORD                             ","                     TO FD-TRAN-TYPE-CD OF FD-TRAN-CAT-KEY                      ","                   MOVE TRAN-CAT-CD OF TRAN-RECORD                              ","                     TO FD-TRAN-CAT-CD OF FD-TRAN-CAT-KEY                       ","                   PERFORM 1500-C-LOOKUP-TRANCATG                               ","                   PERFORM 1100-WRITE-TRANSACTION-REPORT                        ","                ELSE                                                            ","                 DISPLAY 'TRAN-AMT ' TRAN-AMT                                   ","                 DISPLAY 'WS-PAGE-TOTAL'  WS-PAGE-TOTAL                         ","                 ADD TRAN-AMT TO WS-PAGE-TOTAL                                  ","                                 WS-ACCOUNT-TOTAL                               "," /* バッチ設計ビューワー共通の部品。各テンプレートは VIEWS・R・goSel・afterRender・chipLabel を定義してから startApp() を呼ぶ。 */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sp = (k) => { const i = k.indexOf(":"); return [k.slice(0, i), k.slice(i + 1)]; };
const isComment = (t) => t.length > 6 && (t[6] === "*" || t[6] === "/");
const mergeLines = (ls) => ls.reduce((acc, i) => { const last = acc[acc.length - 1]; if (last && i === last[1] + 1) last[1] = i; else acc.push([i, i]); return acc; }, []);
const pill = (cls, text) => `<span class="pill ${cls}">${esc(text)}</span>`;

/* ソースの抜粋。kind が "cobol" なら1〜6桁目（連番）を省いて表示する */
function srcBlock(lines, ranges, hl = [], kind = "cobol") {
  const hlset = new Set();
  hl.forEach(([a, b]) => { for (let i = a; i <= b; i++) hlset.add(i); });
  let out = "";
  ranges.forEach(([a, b], k) => {
    if (k) out += `<span class="src-gap">⋮</span>`;
    for (let i = Math.max(1, a); i <= Math.min(lines.length, b); i++) {
      const t = (lines[i - 1] || "").replace(/\s+$/, "");
      const body = kind === "cobol" ? t.slice(6) : t;
      const cm = kind === "cobol" ? isComment(t) : t.startsWith("//*");
      out += `<span class="ln${cm ? " cm" : ""}"${hlset.has(i) ? ' style="background:var(--hl)"' : ""}><span class="no">${i}</span>${esc(body || " ")}</span>`;
    }
  });
  return `<pre class="src">${out}</pre>`;
}

/* つながり欄。rows は [見出し, キーの配列] */
function chips(keys, max = 8) {
  const one = (k) => `<button class="chip" data-go="${esc(k)}">${esc(chipLabel(k))}</button>`;
  let h = keys.slice(0, max).map(one).join("");
  if (keys.length > max) h += `<details class="more"><summary>ほか${keys.length - max}件</summary>${keys.slice(max).map(one).join("")}</details>`;
  return h;
}
function relBox(rows) {
  return `<div class="rel"><b class="rh">つながり</b>${rows.map(([lab, ks]) => `<div class="relrow"><span class="rl">${esc(lab)}</span><div class="chips">${ks.length ? chips(ks) : '<span class="none">なし</span>'}</div></div>`).join("")}</div>`;
}

  const byKey = Object.fromEntries(D.nodes.map(n => [n.key, n]));
  const on = new Set(), near = new Set();
  const [st] = sp(selKey);

  const clip = (n, tx, ty) => {

/* レコードレイアウトの帯 */
function layoutBar(fields, len, name, useCls) {
  const sc = 600 / len;
  let bar = `<svg class="lay" viewBox="0 0 600 40" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(name)}のレコードレイアウト">`;
  fields.forEach(f => {
    bar += `<rect class="${useCls(f)}" x="${(f.pos[0] - 1) * sc}" y="4" width="${Math.max((f.pos[1] - f.pos[0] + 1) * sc, 1)}" height="22" data-go="I:${f.item}"><title>${f.pos[0]}–${f.pos[1]} ${esc(f.name)}（${esc(f.meaning)}）</title></rect>`;
  });
  return bar + `<text class="sub" x="0" y="38">1</text><text class="sub" x="600" y="38" text-anchor="end">${len}バイト</text></svg>`;
}

/* 画面の切替 */
function render() {
  $("#rail").innerHTML = VIEWS.map((v, i) => `<li><button data-v="${v.id}" aria-current="${v.id === state.view}"><span class="n">${i + 1}</span><span class="t">${esc(v.t)}</span><span class="d">${esc(v.d)}</span></button></li>`).join("");
  $("#main").innerHTML = R[state.view]();
  afterRender();
}
function show(v) {
  state.view = v;
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  render();
  window.scrollTo({ top: 0 });
}
function startApp() {
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]"); if (g) { goSel(g.dataset.go); return; }
    const b = e.target.closest("[data-v]"); if (b) show(b.dataset.v);
  });
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (R[v] && v !== state.view) { state.view = v; render(); } });
  const v = location.hash.slice(1); if (R[v]) state.view = v;
  render();
}

/* ---------- つながり ---------- */
function related(k) {
  const [t, id] = sp(k), out = { S: new Set(), D: new Set(), F: new Set(), I: new Set() };
  const storeOfField = (fk) => DNO[FIELDS[fk].store].id;
  if (t === "S") {
    SB[id].dds.forEach(d => out.D.add(d.store));
    FLOWS.filter(f => f.from === k || f.to === k).forEach(f => out.F.add(f.id));
    Object.entries(IC).forEach(([iid, by]) => { if (by[id]) out.I.add(iid); });
  }
  if (t === "D") {
    Object.keys(DB[id].crudBy).forEach(s => out.S.add(s));
    FLOWS.filter(f => f.from === k || f.to === k).forEach(f => out.F.add(f.id));
    (DB[id].fields || []).forEach(fk => out.I.add(FIELDS[fk].item));
  }
  if (t === "F") {
    const f = FB[id];
    [f.from, f.to].forEach(e => { const [tt, ii] = sp(e); out[tt].add(ii); });
    const st = sp(f.from)[0] === "S" ? sp(f.from)[1] : sp(f.to)[1], ds = sp(f.from)[0] === "D" ? sp(f.from)[1] : sp(f.to)[1];
    Object.entries(IC).forEach(([iid, by]) => { if (by[st] && by[st].fields.some(fk => storeOfField(fk) === ds)) out.I.add(iid); });
  }
  if (t === "I") {
    const it = IB[id];
    it.fields.forEach(fk => out.D.add(storeOfField(fk)));
    Object.keys(IC[id] || {}).forEach(s => out.S.add(s));
    FLOWS.filter(f => { const s = [f.from, f.to].find(e => e.startsWith("S:")), d = [f.from, f.to].find(e => e.startsWith("D:")); return out.S.has(sp(s)[1]) && out.D.has(sp(d)[1]) && (IC[id]?.[sp(s)[1]]?.fields || []).some(fk => storeOfField(fk) === sp(d)[1]); }).forEach(f => out.F.add(f.id));
  }
  out[t].delete(id);
  return out;
}
function chipLabel(k) {
  const [t, id] = sp(k);
  if (t === "S") return `${id} ${SB[id].title}`;
  if (t === "D") return `${DB[id].no} ${DB[id].name}`;
  if (t === "I") return `${id} ${IB[id].name}`;
  if (t === "F") { const f = FB[id], a = sp(f.from), b = sp(f.to), nm = (x) => x[0] === "S" ? x[1] : DB[x[1]].no; return `${id} ${nm(a)}→${nm(b)} ${f.crud}`; }
  return k;
}
const ORDER = (k) => { const [t, id] = sp(k); return t === "D" ? DB[id].no.slice(1).padStart(3, "0") : t === "F" ? id.slice(1).padStart(3, "0") : id; };
const sorted = (keys) => [...keys].sort((a, b) => ORDER(a) < ORDER(b) ? -1 : 1);
function relHtml(k) {
  const r = related(k);
  return relBox([
    ["ステップ", sorted([...r.S].map(x => "S:" + x))],
    ["DFD", sorted([...r.F].map(x => "F:" + x))],
    ["DB・ファイル", sorted([...r.D].map(x => "D:" + x))],
    ["データ項目", sorted([...r.I].map(x => "I:" + x))],
  ]);
}
function goSel(k) {
  const [t] = sp(k);
  const view = { S: "jobflow", F: "dfd", D: "db", I: "items" }[t];
  state.selBy[view] = k;
  show(view);
}

function srcOf(id, ranges, hl = []) { const s = SRCS[id]; return s ? `<p class="ev" style="font-size:12px;color:var(--muted)">${esc(s.path)}</p>` + srcBlock(s.lines, ranges, hl, s.kind) : ""; }
function stepDetail(id) {

  if (s.src) h += `<b class="rh">JCL</b>` + srcOf(s.src, [s.jcl]);

  return h + `</div>`;
}
function ddEvidence(step, d) {
  let h = "";
  if (d.ops && d.ops.length) {

  }
  if (d.line && step.src) h += srcOf(d.override ? step.src : step.src, [[d.line, d.end]]);
  return h;
}
function storeDetail(id) {

  s += `</svg>`;
  return `<div class="viewhead"><h2>ジョブフロー</h2><span class="doctag">設計書でいうと：ジョブフロー図・ジョブネット図</span></div>
  <p class="lead">ジョブ（破線の枠）とステップの実行順です。ステップを押すと、DD とデータセットの対応、JCL、プログラムビューワーへのリンクが右に出ます。</p>
  <div class="flowgrid stack">
    <div class="panel scroll" style="padding:12px">${s}</div>
    <aside class="panel detail" id="detail">${stepDetail(sel)}</aside>
  </div>`;
};

function dfdModel() {
  const nodes = [
    ...STEPS.map(s => { const [x, y] = V.dfd.steps[s.id], t = s.title; const cut = Math.ceil(t.length / 2); return { key: "S:" + s.id, shape: "circle", x, y, r: 56, no: s.id, lines: t.length > 8 ? [t.slice(0, Math.min(cut, 9)), t.slice(Math.min(cut, 9), 18)] : [t], sub: stepPgm(s), cls: s.assumed ? "unused" : "" }; }),
    ...STORES.map(s => { const [x, y] = V.dfd.stores[s.id]; return { key: "D:" + s.id, shape: "store", x, y, w: 176, h: 44, no: s.no, title: s.name, sub: s.id.replace(/^AWS\.M2\.CARDDEMO\./, "") + (s.gdg ? " (+1)" : ""), cls: Object.values(s.crudBy).join("") === "O" ? "unused" : "" }; }),
  ];
  const flows = FLOWS.map(f => ({ key: "F:" + f.id, from: f.from, to: f.to, label: f.crud, cls: f.dash || SB[sp(f.from)[0] === "S" ? sp(f.from)[1] : sp(f.to)[1]].assumed ? "est" : "", offset: f.offset, lt: f.offset ? (f.offset > 0 ? 0.62 : 0.38) : 0.5, lo: [0, -4] }));
  return { width: V.dfd.width, height: V.dfd.height, minWidth: 1000, nodes, flows };
}
R.dfd = () => {
  const k = state.selBy.dfd, [t, id] = sp(k);
  const detail = t === "S" ? stepDetail(id) : t === "D" ? storeDetail(id) : flowDetail(id);
  return `<div class="viewhead"><h2>DFD（ジョブ全体）</h2><span class="doctag">設計書でいうと：DFD（データフロー図）</span></div>
  <p class="lead">丸がステップ（プロセス）、左端に番号を付けた箱がデータセット（データストア）です。上の段はこのジョブでは読むだけのデータ、下の段はこのジョブで作成・更新するデータです。矢印の文字はCRUDで、破線は仮置きのステップや開閉のみの関係です。</p>
  <div class="flowgrid stack">
    <div class="panel"><div class="scroll">${dfdSvg(dfdModel(), k)}</div>
      <div class="legend"><span>C 作成</span><span>R 参照</span><span>U 更新</span><span>D 削除</span><span>O 開閉のみ</span><span>破線：仮置き・推定</span></div></div>
    <aside class="panel detail" id="detail">${detail}</aside>
  </div>`;
};

R.db = () => {
  const [, id] = sp(state.selBy.db);
  return `<div class="viewhead"><h2>DB・ファイル一覧</h2><span class="doctag">設計書でいうと：DB一覧・ファイル一覧・データセット一覧</span></div>
  <p class="lead">ジョブ全体で使うデータセットです。同じデータセット名（DSN）を、ステップをまたいで1行にまとめています。行を押すと、レイアウトと、どのステップがどう使うかが右に出ます。</p>
  <div class="flowgrid">
    <div class="panel scroll"><table>
      <thead><tr><th>D</th><th>名称</th><th>データセット名</th><th>編成</th><th class="num">長さ</th><th>レイアウト</th><th>CRUD</th></tr></thead>
      <tbody>${STORES.map(s => `<tr data-sel="D:${esc(s.id)}" class="${s.id === id ? "selrow" : ""}"><td class="mono">${s.no}</td><td>${esc(s.name)}</td><td class="mono" style="font-size:11.5px">${esc(s.id)}${s.gdg ? " (+1)" : ""}</td><td>${esc(s.kind || "—")}</td><td class="num">${s.lrecl || "—"}</td><td class="mono" style="font-size:11.5px">${s.layout ? esc(s.layout.origin === "program" ? s.layout.record : s.layout.origin) : "—"}</td><td class="mono" style="white-space:nowrap">${Object.entries(s.crudBy).map(([st, c]) => `${st}:${letters(c)}`).join(" ")}</td></tr>`).join("")}</tbody>
    </table></div>
    <aside class="panel detail" id="detail">${storeDetail(id)}</aside>
  </div>`;
};

R.crud = () => {
  const mode = state.crudMode, sel = state.selBy.crud;
  let rows;
  if (mode === "store") rows = STORES.map(s => ({ key: "D:" + s.id, head: `${s.no} ${s.name}`, cells: s.crudBy }));
  else rows = LOG.filter(it => state.crudFilter === "all" || IC[it.id]).map(it => ({ key: "I:" + it.id, head: `${it.id} ${it.name}`, cells: Object.fromEntries(Object.entries(IC[it.id] || {}).map(([k, v]) => [k, v.crud])) }));
  const table = `<table class="matrix"><thead><tr><th class="rowh">${mode === "store" ? "データセット" : "データ項目"}</th>${STEPS.map(s => `<th title="${esc(s.title)}"><span class="mono">${s.id}</span><br><span style="font-weight:400;font-size:11px">${esc(stepPgm(s))}</span></th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${sel && sel.startsWith(r.key + "|") ? "selrow" : ""}"><td class="rowh"><button class="chip" data-go="${esc(r.key)}">${esc(r.head)}</button></td>${STEPS.map(s => { const c = r.cells[s.id] || ""; const k = `${r.key}|${s.id}`; return `<td class="${c ? "cell" : ""} ${sel === k ? "sel" : ""}" ${c ? `data-cell="${esc(k)}"` : ""}>${letters(c)}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  return `<div class="viewhead"><h2>CRUD図</h2><span class="doctag">設計書でいうと：CRUD図（CRUDマトリクス）</span></div>
  <p class="lead">行がデータ、列がステップです。データセット単位はプログラムの入出力文（READ=R、WRITE=C、REWRITE=U、DELETE=D、OPENのみ=O）とJCLから求めています。項目単位は、項目名を参照する行（R）と代入先になる行（U）から推定したもので、作成（C）はレコードを書くとき全項目に付けています。マスを押すと根拠が右に出ます。</p>
  <div class="flowgrid">
    <div class="panel">
      <div class="toolbar filters">
        <button class="btn" data-mode="store" aria-pressed="${mode === "store"}">データセット ${STORES.length}</button>
        <button class="btn" data-mode="item" aria-pressed="${mode === "item"}">データ項目 ${LOG.length}</button>
        ${mode === "item" ? `<label><input type="checkbox" id="onlyUsed" ${state.crudFilter === "used" ? "checked" : ""}> CRUDのある項目だけ</label>` : ""}
      </div>
      <div class="scroll" style="padding:12px">${table}</div>
      <div class="legend"><span class="l-C" style="padding:0 6px">C 作成</span><span class="l-R" style="padding:0 6px">R 参照</span><span class="l-U" style="padding:0 6px">U 更新</span><span class="l-D" style="padding:0 6px">D 削除</span><span class="l-O" style="padding:0 6px">O 開閉のみ</span></div>
    </div>
    <aside class="panel detail" id="detail">${crudDetail(sel)}</aside>
  </div>`;
};
function crudDetail(sel) {
  if (!sel) return `<div class="dbody"><p style="color:var(--muted)">マスを押すと、そのステップがそのデータをどう扱うかの根拠（入出力文・JCL・代入している行）を表示します。</p></div>`;
  const [rk, sid] = sel.split("|"), [t, id] = sp(rk), st = SB[sid];
  if (t === "D") {
    const d = st.dds.find(x => x.store === id);
    return `<div class="dhead"><h3>${DB[id].no} ${esc(DB[id].name)} × ${sid}</h3><span class="orig">${esc(st.title)} · DD ${esc(d.dd)}</span></div><div class="dbody">
      <p class="mono" style="font-size:16px">${letters(d.crud)}　${d.crud.split("").map(c => CRUD_TEXT[c]).join("・")}</p>
      <div><button class="chip" data-go="S:${sid}">${sid} ${esc(st.title)}</button> <button class="chip" data-go="D:${esc(id)}">${DB[id].no} ${esc(DB[id].name)}</button></div>
      ${ddEvidence(st, d)}</div>`;
  }
  const c = IC[id][sid], it = IB[id];
  return `<div class="dhead"><h3>${id} ${esc(it.name)} × ${sid}</h3><span class="orig">${esc(st.title)}</span></div><div class="dbody">
    <p class="mono" style="font-size:16px">${letters(c.crud)}　${c.crud.split("").map(x => CRUD_TEXT[x]).join("・")}（推定）</p>
    <div class="scroll"><table><thead><tr><th>格納先</th><th>物理項目</th></tr></thead><tbody>${c.fields.map(fk => `<tr><td>${FIELDS[fk].store} ${esc(DNO[FIELDS[fk].store].name)}</td><td class="mono">${esc(FIELDS[fk].name)}</td></tr>`).join("")}</tbody></table></div>
    ${c.crud.includes("C") ? `<p style="font-size:12.5px">C：このステップがレコードを書くので、レコードの全項目に付けています。</p>` : ""}
    ${Object.entries(c.ev).map(([l, ls]) => `<b class="rh">${l}（${CRUD_TEXT[l]}）の根拠</b>` + srcOf(st.programSrc, mergeLines(ls))).join("")}
    ${!st.programSrc ? `<p style="font-size:12.5px">ユーティリティのステップなので、レコード単位で全項目を扱うとしています。</p>` : ""}
    <div><button class="chip" data-go="I:${id}">${id} ${esc(it.name)}</button> <button class="chip" data-go="S:${sid}">${sid} ${esc(st.title)}</button></div>
  </div>`;
}

R.items = () => {
  const [, iid] = sp(state.selBy.items), f = state.itemFilter;
  const cnt = { all: LOG.length, multi: LOG.filter(i => new Set(i.fields.map(k => FIELDS[k].store)).size > 1).length, key: LOG.filter(i => i.isKey).length };
  return `<div class="viewhead"><h2>データ項目定義</h2><span class="doctag">設計書でいうと：データ項目定義書（項目辞書）</span></div>
  <p class="lead">データセットをまたいで、同じ意味の項目を1つのデータ項目（DI）にまとめています。例えば「カード番号」は日次取引・カード索引・取引マスターなどにあり、どのステップで作られ、どこで参照されるかを1行で追えます。</p>
  <div class="flowgrid">
    <div class="panel">
      <div class="toolbar filters">
        ${[["all", "全項目"], ["multi", "複数のデータセットにある"], ["key", "キー項目"]].map(([v, l]) => `<button class="btn" data-filter="${v}" aria-pressed="${f === v}">${l} ${cnt[v]}</button>`).join("")}
        <input id="q" type="search" placeholder="項目名で絞り込む" aria-label="項目名で絞り込む">
      </div>
      <div class="scroll"><table>
        <thead><tr><th>ID</th><th>データ項目</th><th>型</th><th>格納先</th>${STEPS.map(s => `<th class="mono">${s.id}</th>`).join("")}</tr></thead>
        <tbody>${LOG.map(it => { const n = new Set(it.fields.map(k => FIELDS[k].store)).size; return `<tr data-sel="I:${it.id}" data-q="${esc((it.name + " " + it.fields.map(k => FIELDS[k].name).join(" ")).toLowerCase())}" data-multi="${n > 1}" data-key="${it.isKey}" class="${it.id === iid ? "selrow" : ""}"><td class="mono">${it.id}</td><td>${esc(it.name)}${it.isKey ? " " + pill("ok", "キー") : ""}</td><td class="mono">${it.pics.join(" / ")}</td><td class="mono">${[...new Set(it.fields.map(k => FIELDS[k].store))].join(" ")}</td>${STEPS.map(s => `<td class="mono">${letters(IC[it.id]?.[s.id]?.crud || "")}</td>`).join("")}</tr>`; }).join("")}</tbody>
      </table></div>
    </div>
    <aside class="panel detail" id="detail">${itemDetail(iid)}</aside>
  </div>`;
};
function applyItemFilter() {
  const q = ($("#q")?.value || "").trim().toLowerCase(), f = state.itemFilter;
  document.querySelectorAll("#main tr[data-q]").forEach(tr => {
    const okF = f === "all" || (f === "multi" && tr.dataset.multi === "true") || (f === "key" && tr.dataset.key === "true");
    tr.hidden = !(okF && (!q || tr.dataset.q.includes(q)));
  });
}

R.coverage = () => `<div class="viewhead"><h2>網羅と未確認</h2><span class="doctag">設計書でいうと：レビュー記録・課題一覧</span></div>
  <p class="lead">ソースとJCLを突き合わせた自動チェックの結果と、資料が足りず確認できていない事項です。自動チェックは、DD とプログラムの SELECT の食い違い、仮置きや推定の箇所、ジョブの外とやり取りするデータを挙げます。</p>
  <div class="panel"><div class="dbody">
    <b>自動チェック（${V.checks.length}件）</b>
    <ul class="checks-list">${V.checks.map(c => `<li>${pill(c.level, c.level === "warn" ? "要確認" : "情報")}<span>${esc(c.text)} <button class="chip" data-go="${esc(c.target)}">開く</button></span></li>`).join("")}</ul>
    <b>未確認事項</b>
    <ol class="open-items">${V.openItems.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    <b>プログラムビューワー</b>
    <ul class="checks-list">${STEPS.filter(s => s.program).map(s => `<li>${s.viewer ? pill("ok", "あり") : pill("none", "未作成")}<span>${s.id} ${esc(s.program)} ${esc(s.title)}${s.viewer ? ` <a href="${esc(s.viewer)}" style="color:var(--accent)">開く</a>` : ""}</span></li>`).join("")}</ul>
    <b>取り込んだソース</b>
    <ul class="checks-list">${Object.entries(SRCS).map(([k, s]) => `<li>${pill("none", s.kind.toUpperCase())}<span class="mono" style="font-size:12px">${esc(s.path)}（${s.lines.length}行）</span></li>`).join("")}</ul>
  </div></div>`;

/* ---------- 画面ごとの操作 ---------- */
function afterRender() {
  if (state.view === "jobflow" || state.view === "dfd") document.querySelectorAll("#main svg [data-k]").forEach(g => g.addEventListener("click", () => { state.selBy[state.view] = g.dataset.k; render(); }));
  if (state.view === "db" || state.view === "items") document.querySelectorAll("#main tr[data-sel]").forEach(tr => tr.addEventListener("click", (e) => { if (e.target.closest("[data-go]")) return; state.selBy[state.view] = tr.dataset.sel; render(); }));
  if (state.view === "items") {
    document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { state.itemFilter = b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", x === b)); applyItemFilter(); }));
    $("#q").addEventListener("input", applyItemFilter);
    applyItemFilter();
  }
  if (state.view === "crud") {
    document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { state.crudMode = b.dataset.mode; state.selBy.crud = null; render(); }));
    $("#onlyUsed")?.addEventListener("change", e => { state.crudFilter = e.target.checked ? "used" : "all"; render(); });
    document.querySelectorAll("[data-cell]").forEach(td => td.addEventListener("click", () => { state.selBy.crud = td.dataset.cell; render(); }));
  }
}

$("#h-title").textContent = V.meta.title;
$("#h-pg").textContent = `${V.jobs.length}ジョブ · ${STEPS.length}ステップ · ${STORES.length}データセット`;
startApp();
</script>

</body>
</html>
